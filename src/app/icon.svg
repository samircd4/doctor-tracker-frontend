<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Doctor Tracker favicon: white stethoscope on a brand-navy rounded square.
       Solid background + thick strokes so it stays readable at 16px on light and dark tabs. -->
  <rect width="32" height="32" rx="7" fill="#0f184d"/>
  <g transform="translate(5 5) scale(0.9167)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stethoscope shape (Lucide icon, ISC license) -->
    <path d="M11 2v2"/>
    <path d="M5 2v2"/>
    <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/>
    <path d="M8 15a6 6 0 0 0 12 0v-3"/>
    <circle cx="20" cy="10" r="2"/>
  </g>
</svg>
